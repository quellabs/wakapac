name: Tag and publish to npm

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check for version bump
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LATEST_TAG=$(git tag --list --sort=-v:refname | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ -z "$LATEST_TAG" ]; then
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          else
            IS_NEWER=$(node -e "
              const gt = (a, b) => {
                const pa = a.split('.').map(Number);
                const pb = b.split('.').map(Number);
                for (let i = 0; i < 3; i++) {
                  if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) > (pb[i] || 0);
                }
                return false;
              };
              console.log(gt('$VERSION', '$LATEST_TAG'));
            ")
            echo "is_new=$IS_NEWER" >> "$GITHUB_OUTPUT"
          fi

          echo "Latest tag: ${LATEST_TAG:-<none>}, package.json version: $VERSION"

      - name: Create and push tag
        if: steps.check.outputs.is_new == 'true'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Publish to npm
        if: steps.check.outputs.is_new == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
