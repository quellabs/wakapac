<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WakaPAC Spreadsheet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --cell-height: 28px;
            --cell-min-width: 100px;
            --header-bg: #f0f1f4;
            --header-bg-active: #d3e3fd;
            --header-text: #444746;
            --header-text-active: #0b57d0;
            --grid-border: #e1e3e6;
            --cell-bg: #fff;
            --select-border: #1a73e8;
            --select-fill: rgba(26, 115, 232, 0.08);
            --edit-shadow: 0 1px 4px rgba(0,0,0,0.18), 0 0 0 2px var(--select-border);
            --formula-bar-height: 34px;
            --toolbar-height: 38px;
            --row-header-width: 46px;
            --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font-body),serif;
            font-size: 13px;
            color: #202124;
            background: #fff;
        }

        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            align-items: center;
            height: var(--toolbar-height);
            padding: 0 8px;
            border-bottom: 1px solid var(--grid-border);
            background: #f8f9fa;
            gap: 2px;
        }
        .toolbar-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border: none;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            color: #444;
            font-size: 14px;
            font-weight: 600;
        }
        .toolbar-btn:hover { background: #e8eaed; }
        .toolbar-sep { width: 1px; height: 20px; background: #dadce0; margin: 0 4px; }

        /* ── PAC container — wraps formula bar + grid ── */
        .spreadsheet-outer {
            display: flex;
            flex-direction: column;
            height: calc(100% - var(--toolbar-height) - 24px);
            outline: none;
        }

        /* ── Formula Bar (inside PAC container) ── */
        .formula-bar {
            display: flex;
            align-items: center;
            height: var(--formula-bar-height);
            min-height: var(--formula-bar-height);
            border-bottom: 1px solid var(--grid-border);
            background: #fff;
        }

        .cell-name-box {
            width: 80px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--grid-border);
            font-family: var(--font-mono),serif;
            font-size: 12px;
            font-weight: 500;
            color: var(--header-text);
            background: var(--header-bg);
            user-select: none;
            flex-shrink: 0;
        }

        .formula-input {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            padding: 0 10px;
            font-family: var(--font-mono),serif;
            font-size: 13px;
            color: #202124;
        }

        .formula-input:focus {
            background: #e8f0fe;
        }

        /* ── Grid scroll area ── */
        .grid-scroll-area {
            flex: 1;
            position: relative;
            overflow: auto;
        }

        /* ── Table ── */
        .grid-table {
            border-collapse: collapse;
            table-layout: fixed;
            user-select: none;
        }

        /* ── Column headers (A, B, C, ...) and the corner cell ── */
        .col-header, .corner-header {
            position: sticky;
            top: 0;
            height: var(--cell-height);
            min-width: var(--cell-min-width);
            background: var(--header-bg);
            border-right: 1px solid var(--grid-border);
            border-bottom: 2px solid #c7c7cc;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: var(--header-text);
            padding: 0 4px;
            vertical-align: middle;
            overflow: hidden;
        }
        .col-header { z-index: 10; }
        .corner-header {
            left: 0;
            z-index: 12;
            width: var(--row-header-width);
            min-width: var(--row-header-width);
        }
        .col-header.active {
            background: var(--header-bg-active);
            color: var(--header-text-active);
            font-weight: 600;
        }

        /* ── Row headers (1, 2, 3, ...) ── */
        .row-header {
            position: sticky;
            left: 0;
            z-index: 10;
            width: var(--row-header-width);
            min-width: var(--row-header-width);
            background: var(--header-bg);
            border-right: 1px solid var(--grid-border);
            border-bottom: 1px solid var(--grid-border);
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: var(--header-text);
            vertical-align: middle;
            overflow: hidden;
        }
        .row-header.active {
            background: var(--header-bg-active);
            color: var(--header-text-active);
            font-weight: 600;
        }

        /* ── Data cells ── */
        td.cell {
            height: var(--cell-height);
            min-width: var(--cell-min-width);
            max-width: var(--cell-min-width);
            background: var(--cell-bg);
            border-right: 1px solid var(--grid-border);
            border-bottom: 1px solid var(--grid-border);
            padding: 0 5px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
            cursor: cell;
            position: relative;
        }

        td.cell.numeric { text-align: right; }
        td.cell.error { color: #c5221f; font-family: var(--font-mono),serif; }

        /* Active cell and range selection are plain per-cell state now — no
           overlay elements to keep positioned in JS. */
        td.cell.selected { box-shadow: inset 0 0 0 2px var(--select-border); z-index: 1; }
        td.cell.in-range { background: var(--select-fill); }

        /* ── Inline cell editor — a single floating <input>, positioned via
             a bound `style` (see editorStyle computed) rather than
             getBoundingClientRect measurements. ── */
        .cell-editor {
            position: absolute;
            z-index: 20;
            border: none;
            outline: none;
            padding: 0 4px;
            font-family: var(--font-body),serif;
            font-size: 13px;
            color: #202124;
            background: #fff;
            box-shadow: var(--edit-shadow);
        }

        /* ── Status bar ── */
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 24px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            background: var(--header-bg);
            border-top: 1px solid var(--grid-border);
            font-size: 11px;
            color: #5f6368;
            z-index: 20;
            gap: 20px;
        }

        .status-bar .status-section {
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

<!-- Toolbar (static UI — no interaction wired yet) -->
<div class="toolbar">
    <button class="toolbar-btn" title="Bold"><b>B</b></button>
    <button class="toolbar-btn" title="Italic"><i>I</i></button>
    <button class="toolbar-btn" title="Underline"><u>U</u></button>
    <div class="toolbar-sep"></div>
    <button class="toolbar-btn" title="Align Left">≡</button>
    <button class="toolbar-btn" title="Align Center">≡</button>
    <button class="toolbar-btn" title="Align Right">≡</button>
    <div class="toolbar-sep"></div>
    <button class="toolbar-btn" title="Delete cell contents">⌫</button>
</div>

<!--
    Single PAC container. The formula bar, scrollable grid, cell editor,
    and status bar all live inside it. All interaction flows through
    msgProc — zero addEventListener calls. Grid rendering itself, though, is entirely
    declarative: nested `foreach` builds the table body, `class`/`style`
    bindings drive selection highlighting and the editor's position, and
    `computed` properties drive the formula bar / status bar text. No
    createElement, no querySelector-and-mutate render loop.
-->
<div class="spreadsheet-outer" id="spreadsheet" data-pac-id="spreadsheet" tabindex="0">
    <!--
        Two performance notes for the two text inputs below (see the JS for
        the fuller story):

        data-pac-update-mode="change": a reactive property write
        re-evaluates every bound element/text node in the whole component
        (WakaPAC doesn't scope that pass to actual dependents), so with
        ~1300 bound cells the default "immediate" mode turns every
        keystroke into a full-grid pass. "change" defers the write to blur
        instead — nothing here needs the live keystroke value reactively:
        _commitEdit/_commitFormulaBar read the input's .value directly, and
        the formula-bar mirror reads it straight off the MSG_INPUT_COMPLETE
        event.

        sel.editorValue / sel.formulaValue (nested under one `sel` object,
        not flat top-level properties): every *other* write these two
        participate in — selecting a cell, opening/closing the editor,
        committing — is batched into that same single object via
        _updateSel(), so one user action is one reactive pass, not one per
        field touched.
    -->
    <div class="formula-bar">
        <div class="cell-name-box">{{activeCellRef}}</div>
        <input class="formula-input" id="formulaInput" type="text" spellcheck="false"
               placeholder="Value, or a formula like =SUM(A1:A10)"
               data-pac-update-mode="change"
               data-pac-bind="value: sel.formulaValue">
    </div>
    <div class="grid-scroll-area" id="gridScrollArea">
        <table class="grid-table">
            <thead>
                <!-- headerCells[0] is the corner cell; the rest are columns A..Z -->
                <tr data-pac-bind="foreach: headerCells" data-pac-item="hcell" data-pac-index="colIndex">
                    <th data-pac-bind="class: {
                            'corner-header': hcell.isCorner,
                            'col-header': !hcell.isCorner,
                            active: !hcell.isCorner && isColActive(colIndex - 1)
                        }">{{hcell.display}}</th>
                </tr>
            </thead>
            <tbody data-pac-bind="foreach: grid" data-pac-item="row" data-pac-index="rowIndex">
                <!--
                    row.slots[0] is the row-header; the rest are the row's 26
                    data cells. slot itself only carries structural info
                    (isHeader) — actual values come from the separate
                    cellData array (see buildGrid's docstring for why), read
                    here via cellData[rowIndex][colIndex - 1]. The `&&`/`?:`
                    short-circuiting means that lookup is never evaluated
                    for the header slot (where colIndex-1 would be -1).
                -->
                <tr data-pac-bind="foreach: row.slots" data-pac-item="slot" data-pac-index="colIndex">
                    <td data-pac-bind="class: {
                            'row-header': slot.isHeader,
                            cell: !slot.isHeader,
                            numeric: !slot.isHeader && cellData[rowIndex][colIndex - 1].numeric,
                            error: !slot.isHeader && cellData[rowIndex][colIndex - 1].formulaError,
                            active: slot.isHeader && isRowActive(rowIndex),
                            selected: !slot.isHeader && isCellSelected(rowIndex, colIndex - 1),
                            'in-range': !slot.isHeader && isCellInRange(rowIndex, colIndex - 1)
                        }, 'data-row': rowIndex, 'data-col': colIndex - 1"
                    >{{ slot.isHeader ? slot.display : cellData[rowIndex][colIndex - 1].value }}</td>
                </tr>
            </tbody>
        </table>

        <input class="cell-editor" id="cellEditor" type="text" spellcheck="false" autocomplete="off"
               data-pac-update-mode="change"
               data-pac-bind="visible: sel.editing, value: sel.editorValue, style: editorStyle">
    </div>

    <!-- Status bar — nested inside the PAC container so {{ }} interpolation
         can reach statusText/aggregateText. position:fixed keeps it pinned
         to the viewport regardless of DOM nesting. -->
    <div class="status-bar">
        <div class="status-section">{{statusText}}</div>
        <div class="status-section">{{aggregateText}}</div>
    </div>
</div>

<script src="../wakapac.js"></script>
<script>
    (function () {
        "use strict";

        // =====================================================================
        // CONSTANTS
        // =====================================================================

        /** Number of columns (A through Z) */
        const NUM_COLS = 12;

        /** Number of rows */
        const NUM_ROWS = 24;

        /**
         * Cell geometry, mirroring the --cell-height / --cell-min-width /
         * --row-header-width CSS custom properties above. Needed in JS only
         * because the floating editor's position is computed from these
         * (grid column/row math), not measured off the DOM.
         */
        const CELL_WIDTH = 100;
        const CELL_HEIGHT = 28;
        const ROW_HEADER_WIDTH = 46;

        // =====================================================================
        // UTILITY FUNCTIONS
        // =====================================================================

        /**
         * Converts a zero-based column index to a letter (0 → "A", 25 → "Z").
         * @param {number} c - Column index.
         * @returns {string} Column letter.
         */
        function colToLetter(c) {
            return String.fromCharCode(65 + c);
        }

        /**
         * Builds a cell reference string from column and row indices.
         * @param {number} c - Zero-based column index.
         * @param {number} r - Zero-based row index.
         * @returns {string} Cell reference (e.g. "A1", "C12").
         */
        function cellRef(c, r) {
            return colToLetter(c) + (r + 1);
        }

        /**
         * Clamps a value to an inclusive range.
         * @param {number} v - Input value.
         * @param {number} lo - Minimum.
         * @param {number} hi - Maximum.
         * @returns {number} Clamped value.
         */
        function clamp(v, lo, hi) {
            return Math.max(lo, Math.min(hi, v));
        }

        /**
         * Tests whether a trimmed string represents a finite number.
         * @param {*} v - Value to test.
         * @returns {boolean} True if numeric.
         */
        function isNumeric(v) {
            return v !== "" && v !== null && !isNaN(v);
        }

        /**
         * Parses a single-letter cell reference (this sheet only has 26
         * columns, so multi-letter refs like "AA1" are out of range) into
         * zero-based coordinates.
         * @param {string} ref - Cell reference (e.g. "B3").
         * @returns {{col: number, row: number}|null} Null if out of range.
         */
        function parseCellRef(ref) {
            const m = ref.match(/^([A-Z]+)([0-9]+)$/);

            if (!m || m[1].length !== 1) {
                return null;
            }

            const col = m[1].charCodeAt(0) - 65;
            const row = parseInt(m[2], 10) - 1;

            if (col < 0 || col >= NUM_COLS || row < 0 || row >= NUM_ROWS) {
                return null;
            }

            return { col, row };
        }

        // =====================================================================
        // FORMULA ENGINE
        // =====================================================================
        //
        // A cell whose raw text starts with "=" is a formula: simple
        // arithmetic (+ - * / and parentheses) over numbers and cell
        // references, plus SUM/AVERAGE(or AVG)/COUNT/MIN/MAX over a
        // "A1:B5"-style range or a comma-separated argument list.
        //
        // This is plain domain logic, not something WakaPAC provides —
        // WakaPAC's job stays "render the grid reactively"; recalculateFormulas
        // just mutates the same reactive cell slots the rest of the sheet
        // already mutates, so the bound <td>s update themselves as usual.

        /**
         * Splits a formula's body into tokens. Throws a formula error (with
         * a `.code` matching a spreadsheet error string) on invalid input.
         * @param {string} text - Formula text with the leading "=" removed.
         * @returns {Array<{type: string, value?: (number|string)}>}
         */
        function tokenizeFormula(text) {
            const tokens = [];
            const re = /\s*(?:([0-9]+(?:\.[0-9]+)?)|([A-Za-z]+[0-9]*)|([:,()+\-*/]))/y;
            let i = 0;

            while (i < text.length) {
                re.lastIndex = i;
                const m = re.exec(text);

                if (!m) {
                    formulaFail("#ERROR!");
                }

                i = re.lastIndex;

                if (m[1] !== undefined) {
                    tokens.push({ type: "NUM", value: parseFloat(m[1]) });
                } else if (m[2] !== undefined) {
                    tokens.push({ type: "WORD", value: m[2].toUpperCase() });
                } else if (m[3] !== undefined) {
                    tokens.push({ type: m[3] });
                }
            }

            return tokens;
        }

        /**
         * Throws an Error carrying a spreadsheet error code (e.g. "#REF!")
         * as its `.code`, for recalculateFormulas to catch and display.
         * @param {string} code
         */
        function formulaFail(code) {
            const error = new Error(code);
            error.code = code;
            throw error;
        }

        /**
         * Parses and evaluates a formula's body against the given resolver
         * callbacks, which look up cell/range values in the sheet.
         * @param {string} text - Formula text with the leading "=" removed.
         * @param {{resolveRef: function(string): number, resolveRange: function(string, string): number[]}} refs
         * @returns {number} The formula's numeric result.
         */
        function evaluateFormula(text, refs) {
            const tokens = tokenizeFormula(text);
            let pos = 0;

            function peek() { return tokens[pos]; }
            function advance() { return tokens[pos++]; }

            function parseExpr() {
                let value = parseTerm();

                while (peek() && (peek().type === "+" || peek().type === "-")) {
                    const op = advance().type;
                    const rhs = parseTerm();
                    value = op === "+" ? value + rhs : value - rhs;
                }

                return value;
            }

            function parseTerm() {
                let value = parseFactor();

                while (peek() && (peek().type === "*" || peek().type === "/")) {
                    const op = advance().type;
                    const rhs = parseFactor();

                    if (op === "*") {
                        value *= rhs;
                    } else {
                        if (rhs === 0) {
                            formulaFail("#DIV/0!");
                        }

                        value /= rhs;
                    }
                }

                return value;
            }

            function parseFactor() {
                const t = peek();

                if (!t) {
                    formulaFail("#ERROR!");
                }

                if (t.type === "-") { advance(); return -parseFactor(); }
                if (t.type === "+") { advance(); return parseFactor(); }
                if (t.type === "NUM") { advance(); return t.value; }

                if (t.type === "(") {
                    advance();
                    const value = parseExpr();

                    if (!peek() || peek().type !== ")") {
                        formulaFail("#ERROR!");
                    }

                    advance();
                    return value;
                }

                if (t.type === "WORD") {
                    advance();

                    if (peek() && peek().type === "(") {
                        advance();
                        const args = parseArgs();

                        if (!peek() || peek().type !== ")") {
                            formulaFail("#ERROR!");
                        }

                        advance();
                        return callFunction(t.value, args);
                    }

                    if (!/^[A-Z]+[0-9]+$/.test(t.value)) {
                        formulaFail("#REF!");
                    }

                    return refs.resolveRef(t.value);
                }

                formulaFail("#ERROR!");
            }

            // A function's argument list is a comma-separated mix of plain
            // expressions and "A1:B5" ranges; both are flattened into one
            // number array so SUM/AVERAGE/etc. don't need to care which.
            function parseArgs() {
                const values = [];

                if (peek() && peek().type === ")") {
                    return values;
                }

                while (true) {
                    values.push(...parseArg());

                    if (peek() && peek().type === ",") {
                        advance();
                        continue;
                    }

                    break;
                }

                return values;
            }

            function parseArg() {
                if (peek() && peek().type === "WORD" && tokens[pos + 1] && tokens[pos + 1].type === ":") {
                    const ref1 = advance().value;
                    advance(); // ':'
                    const ref2 = advance();

                    if (!ref2 || ref2.type !== "WORD") {
                        formulaFail("#REF!");
                    }

                    return refs.resolveRange(ref1, ref2.value);
                }

                return [parseExpr()];
            }

            function callFunction(name, args) {
                switch (name) {
                    case "SUM":
                        return args.reduce((a, b) => a + b, 0);

                    case "AVERAGE":
                    case "AVG":
                        if (args.length === 0) { formulaFail("#DIV/0!"); }
                        return args.reduce((a, b) => a + b, 0) / args.length;

                    case "COUNT":
                        return args.length;

                    case "MIN":
                        if (args.length === 0) { formulaFail("#ERROR!"); }
                        return Math.min(...args);

                    case "MAX":
                        if (args.length === 0) { formulaFail("#ERROR!"); }
                        return Math.max(...args);

                    default:
                        formulaFail("#NAME?");
                }
            }

            const result = parseExpr();

            if (peek()) {
                formulaFail("#ERROR!");
            }

            if (typeof result !== "number" || !isFinite(result)) {
                formulaFail("#ERROR!");
            }

            return result;
        }

        /**
         * Recalculates every formula cell in the sheet. Each cell is
         * evaluated recursively (a formula referencing another formula
         * resolves that one first) with per-pass memoization and cycle
         * detection, then the result is written into the same reactive
         * cellData slot the rest of the sheet mutates — WakaPAC's own
         * bindings pick the change up from there.
         * @param {Array} cellData - The component's cellData array.
         */
        function recalculateFormulas(cellData) {
            const memo = new Map();

            function slotAt(row, col) {
                if (row < 0 || row >= cellData.length || col < 0 || col >= NUM_COLS) {
                    return null;
                }

                return cellData[row][col];
            }

            function evalCell(row, col, visiting) {
                const key = row + "," + col;

                if (memo.has(key)) {
                    return memo.get(key);
                }

                const slot = slotAt(row, col);

                if (!slot) {
                    return { error: "#REF!" };
                }

                if (!slot.raw.startsWith("=")) {
                    // Blank cells act as 0 in arithmetic (matching common
                    // spreadsheet convention) but are excluded from ranges
                    // by resolveRange's own `blank` check below.
                    const result = slot.raw === ""
                        ? { value: 0, blank: true }
                        : { value: slot.value };

                    memo.set(key, result);
                    return result;
                }

                if (visiting.has(key)) {
                    const result = { error: "#CIRCULAR!" };
                    memo.set(key, result);
                    return result;
                }

                visiting.add(key);

                let result;

                try {
                    const value = evaluateFormula(slot.raw.slice(1), {
                        resolveRef(ref) {
                            const pos = parseCellRef(ref);

                            if (!pos) {
                                formulaFail("#REF!");
                            }

                            const cellResult = evalCell(pos.row, pos.col, visiting);

                            if (cellResult.error) {
                                formulaFail(cellResult.error);
                            }

                            if (typeof cellResult.value !== "number") {
                                formulaFail("#VALUE!");
                            }

                            return cellResult.value;
                        },

                        resolveRange(ref1, ref2) {
                            const p1 = parseCellRef(ref1);
                            const p2 = parseCellRef(ref2);

                            if (!p1 || !p2) {
                                formulaFail("#REF!");
                            }

                            const values = [];

                            for (let r = Math.min(p1.row, p2.row); r <= Math.max(p1.row, p2.row); r++) {
                                for (let c = Math.min(p1.col, p2.col); c <= Math.max(p1.col, p2.col); c++) {
                                    const cellResult = evalCell(r, c, visiting);

                                    if (!cellResult.error && !cellResult.blank && typeof cellResult.value === "number") {
                                        values.push(cellResult.value);
                                    }
                                }
                            }

                            return values;
                        }
                    });

                    result = { value };
                } catch (error) {
                    result = { error: error.code || "#ERROR!" };
                }

                visiting.delete(key);
                memo.set(key, result);
                return result;
            }

            for (let r = 0; r < cellData.length; r++) {
                for (let c = 0; c < NUM_COLS; c++) {
                    const slot = slotAt(r, c);

                    if (!slot.raw.startsWith("=")) {
                        continue;
                    }

                    const result = evalCell(r, c, new Set());
                    const newValue = result.error ? result.error : result.value;
                    const newNumeric = !result.error;
                    const newFormulaError = !!result.error;

                    // Skip the write entirely when the result hasn't
                    // actually changed — this runs after every edit
                    // anywhere in the sheet, so most formula cells on a
                    // given pass are unaffected and should cost nothing.
                    if (slot.value === newValue && slot.numeric === newNumeric && slot.formulaError === newFormulaError) {
                        continue;
                    }

                    // One reactive write (replacing the whole slot) instead
                    // of three field writes, same reasoning as _setCellData.
                    cellData[r][c] = {
                        raw: slot.raw,
                        value: newValue,
                        numeric: newNumeric,
                        formulaError: newFormulaError
                    };
                }
            }
        }

        // =====================================================================
        // GRID DATA MODEL
        // =====================================================================

        /**
         * Builds the header row's data: a leading corner marker followed by
         * one entry per column letter. Rendered by the thead's foreach.
         * @returns {Array<{isCorner: boolean, display: string}>}
         */
        function buildHeaderCells() {
            const cells = [{ isCorner: true, display: "" }];

            for (let c = 0; c < NUM_COLS; c++) {
                cells.push({ isCorner: false, display: colToLetter(c) });
            }

            return cells;
        }

        /**
         * Builds the grid's STRUCTURE: one entry per row, each holding a
         * leading row-header slot followed by NUM_COLS placeholder data-cell
         * slots. This is what the nested foreach (tbody > tr) actually
         * iterates, and — critically — it is built once and never mutated
         * again. WakaPAC's foreach-rebuild rule fires whenever a changed
         * path is nested under (or an ancestor of) a foreach's bound array,
         * which means editing so much as one field of one cell here would
         * rebuild the ENTIRE 1300-cell grid from scratch, every time,
         * regardless of how few writes that edit takes (measured: still
         * ~280ms even after collapsing a cell edit to a single write).
         * Actual cell content lives in the separate, never-foreach-bound
         * cellData array (see buildCellData) instead, so editing it only
         * costs the ordinary reactive re-scan, not a rebuild.
         * @returns {Array<{slots: Array}>}
         */
        function buildGrid() {
            const rows = [];

            for (let r = 0; r < NUM_ROWS; r++) {
                const slots = [{ isHeader: true, display: r + 1 }];

                for (let c = 0; c < NUM_COLS; c++) {
                    slots.push({ isHeader: false });
                }

                rows.push({ slots });
            }

            return rows;
        }

        /**
         * Builds the reactive cell VALUES: NUM_ROWS x NUM_COLS, indexed the
         * same as buildGrid's data slots (column c here == slot index c+1).
         * This is what _setCellData actually mutates — see buildGrid's
         * docstring for why it's kept separate.
         * @returns {Array<Array<{raw: string, value: (string|number), numeric: boolean, formulaError: boolean}>>}
         */
        function buildCellData() {
            const rows = [];

            for (let r = 0; r < NUM_ROWS; r++) {
                const cols = [];

                for (let c = 0; c < NUM_COLS; c++) {
                    cols.push({ raw: "", value: "", numeric: false, formulaError: false });
                }

                rows.push(cols);
            }

            return rows;
        }

        // =====================================================================
        // SPREADSHEET PAC COMPONENT
        // =====================================================================

        wakaPAC("#spreadsheet", {

            // -----------------------------------------------------------------
            // State
            // -----------------------------------------------------------------

            /** Header row: corner marker + 26 column-letter cells */
            headerCells: buildHeaderCells(),

            /**
             * Grid STRUCTURE only (NUM_ROWS entries, each with 27 slots) —
             * built once, never mutated. See buildGrid's docstring for why
             * that separation matters.
             */
            grid: buildGrid(),

            /** Actual cell values — NUM_ROWS x NUM_COLS, mutated by every edit. */
            cellData: buildCellData(),

            /**
             * All selection + inline-edit state, bundled into one reactive
             * object instead of separate top-level properties. Every write
             * (a click, an arrow key, opening/closing the editor) replaces
             * this object wholesale via _updateSel() — one reactive pass
             * per user action, not one per field that action touches. See
             * the update-mode comment on the two inputs above for why that
             * matters: a single pass here costs the same as a full re-scan
             * of all ~1300 bound cells, so the field count per action is
             * the whole performance story.
             */
            sel: {
                /** Active cell column/row (zero-based). */
                col: 0,
                row: 0,

                /** Range selection end column/row, or null when no range is active. */
                endCol: null,
                endRow: null,

                /** True when the inline cell editor is open. */
                editing: false,

                /** Two-way bound to the floating cell editor <input>. */
                editorValue: "",

                /** Two-way bound to the formula bar <input> — mirrors the active cell's raw text. */
                formulaValue: ""
            },

            /** True when the formula bar has focus and is being edited */
            _editingFormulaBar: false,

            /** True during a mouse-drag range selection (capture is held) */
            _dragging: false,

            /**
             * Guard flag: set after a drag-select ends with a real range,
             * so the subsequent MSG_LCLICK doesn't overwrite the selection.
             */
            _wasDrag: false,

            /** Memoization for _rangeBounds() — see its docstring. */
            _boundsCache: null,
            _boundsCacheKey: null,

            // -----------------------------------------------------------------
            // DOM references (assigned in init) — only for focus handling and
            // scrollIntoView; rendering itself needs none of these.
            // -----------------------------------------------------------------

            _scrollArea: null,
            _editorInput: null,
            _formulaInputEl: null,

            // =================================================================
            // COMPUTED
            // =================================================================

            computed: {
                /** "A1"-style reference for the active cell, shown in the cell-name box. */
                activeCellRef() {
                    return cellRef(this.sel.col, this.sel.row);
                },

                /** Status-bar left segment. */
                statusText() {
                    return this.sel.editing ? "Edit" : "Ready";
                },

                /**
                 * Status-bar right segment: Sum/Avg/Count over numeric cells
                 * in the current selection. Recomputes automatically whenever
                 * the selection or any cell value changes.
                 */
                aggregateText() {
                    const b = this._rangeBounds();
                    const values = [];

                    for (let r = b.minRow; r <= b.maxRow; r++) {
                        for (let c = b.minCol; c <= b.maxCol; c++) {
                            const slot = this._cellSlot(r, c);

                            if (slot.numeric) {
                                values.push(slot.value);
                            }
                        }
                    }

                    if (values.length > 1) {
                        const sum = values.reduce((a, x) => a + x, 0);
                        return `Sum: ${sum}   Avg: ${(sum / values.length).toFixed(2)}   Count: ${values.length}`;
                    }

                    return "";
                },

                /**
                 * Floating editor's position/size, in the grid's own
                 * (scroll-independent) coordinate space — see the CELL_*
                 * constants. Replaces the old getBoundingClientRect-based
                 * positioning entirely.
                 */
                editorStyle() {
                    return {
                        left: (ROW_HEADER_WIDTH + this.sel.col * CELL_WIDTH) + "px",
                        top: ((this.sel.row + 1) * CELL_HEIGHT) + "px",
                        width: CELL_WIDTH + "px",
                        height: CELL_HEIGHT + "px"
                    };
                }
            },

            // =================================================================
            // LIFECYCLE
            // =================================================================

            /**
             * Grabs the DOM references still needed for focus handling and
             * scrollIntoView, then focuses the grid. The grid itself is
             * already fully rendered by the foreach/class/style bindings —
             * no construction step required here.
             */
            init() {
                this._scrollArea = document.getElementById("gridScrollArea");
                this._editorInput = document.getElementById("cellEditor");
                this._formulaInputEl = document.getElementById("formulaInput");

                this._focusGrid();
            },

            // =================================================================
            // FOCUS HELPERS
            // =================================================================

            /**
             * Returns which sub-element currently holds keyboard focus.
             * @returns {"editor"|"formulaBar"|"grid"}
             */
            _focusedElement() {
                const active = document.activeElement;

                if (active === this._editorInput) {
                    return "editor";
                } else if (active === this._formulaInputEl) {
                    return "formulaBar";
                } else {
                    return "grid";
                }
            },

            /**
             * Moves keyboard focus back to the grid container so that
             * subsequent keystrokes are handled as navigation/input.
             */
            _focusGrid() {
                document.getElementById("spreadsheet").focus();
            },

            // =================================================================
            // MESSAGE PROCEDURE
            // =================================================================

            /**
             * Central message handler. Every user interaction — mouse clicks,
             * keyboard input, focus changes, clipboard operations — arrives
             * here as a Win32-style message.
             * @param {CustomEvent} event - PAC event with .message, .wParam, .lParam, .originalEvent
             * @returns {false|undefined} Return false for cancellable messages to prevent default handling.
             */
            msgProc(event) {
                switch (event.message) {

                    // ---------------------------------------------------------
                    // Mouse: click selects a cell (or extends range with Shift)
                    // ---------------------------------------------------------
                    case wakaPAC.MSG_LCLICK: {
                        // Skip if we just finished a drag-select — the LCLICK
                        // fires after LBUTTONUP and would overwrite the range.
                        if (this._wasDrag) {
                            this._wasDrag = false;
                            break;
                        }

                        const hit = this._hitTest(event);

                        if (!hit) {
                            break;
                        }

                        // Commit any in-progress edits before changing selection
                        if (this.sel.editing) {
                            this._commitEdit();
                        }

                        if (this._editingFormulaBar) {
                            this._commitFormulaBar();
                        }

                        // Shift-click extends the selection range; either way,
                        // editing is always closed and this is one _updateSel
                        // write regardless of which branch runs.
                        if (event.wParam & wakaPAC.MK_SHIFT) {
                            this._updateSel({ editing: false, endCol: hit.col, endRow: hit.row });
                        } else {
                            this._updateSel({ editing: false, col: hit.col, row: hit.row, endCol: null, endRow: null });
                        }

                        this._focusGrid();
                        return false;
                    }

                    // ---------------------------------------------------------
                    // Mouse: double-click selects and edits the clicked cell
                    // in one gesture — _enterEditMode(hit) folds both into a
                    // single _updateSel write.
                    // ---------------------------------------------------------
                    case wakaPAC.MSG_LBUTTONDBLCLK: {
                        const hit = this._hitTest(event);

                        if (!hit) {
                            break;
                        }

                        this._enterEditMode(hit);
                        return false;
                    }

                    // ---------------------------------------------------------
                    // Mouse: button down starts a potential drag-select.
                    // Capture is acquired so MOUSEMOVE keeps arriving even
                    // if the cursor leaves the grid.
                    // ---------------------------------------------------------
                    case wakaPAC.MSG_LBUTTONDOWN: {
                        const hit = this._hitTest(event);

                        if (!hit) {
                            break;
                        }

                        if (this.sel.editing) {
                            this._commitEdit();
                        }

                        if (this._editingFormulaBar) {
                            this._commitFormulaBar();
                        }

                        this._updateSel({ editing: false, col: hit.col, row: hit.row, endCol: null, endRow: null });
                        this._dragging = true;
                        wakaPAC.setCapture(this.pacId);
                        break;
                    }

                    // ---------------------------------------------------------
                    // Mouse: move extends the range during a drag-select
                    // ---------------------------------------------------------
                    case wakaPAC.MSG_MOUSEMOVE: {
                        if (!this._dragging) {
                            break;
                        }

                        const oe = event.originalEvent;

                        if (!oe) {
                            break;
                        }

                        const hit = this._hitTestCoords(oe.clientX, oe.clientY);

                        if (hit && (this.sel.endCol !== hit.col || this.sel.endRow !== hit.row)) {
                            this._updateSel({ endCol: hit.col, endRow: hit.row });
                        }

                        break;
                    }

                    // ---------------------------------------------------------
                    // Mouse: button up ends the drag-select and releases capture
                    // ---------------------------------------------------------
                    case wakaPAC.MSG_LBUTTONUP: {
                        if (!this._dragging) {
                            break;
                        }

                        this._dragging = false;
                        wakaPAC.releaseCapture();

                        // Collapse range to single cell if start == end
                        if (this.sel.endCol === this.sel.col && this.sel.endRow === this.sel.row) {
                            this._updateSel({ endCol: null, endRow: null });
                        }

                        // Flag so the subsequent LCLICK doesn't overwrite the range
                        if (this.sel.endCol !== null || this.sel.endRow !== null) {
                            this._wasDrag = true;
                        }

                        break;
                    }

                    // ---------------------------------------------------------
                    // Keyboard: all keydown events route through _handleKeyDown
                    // which dispatches based on which sub-element has focus
                    // ---------------------------------------------------------
                    case wakaPAC.MSG_KEYDOWN: {
                        this._handleKeyDown(event);
                        break;
                    }

                    // ---------------------------------------------------------
                    // Character input: when the grid is focused, typing a
                    // printable character opens the editor with that character
                    // ---------------------------------------------------------
                    case wakaPAC.MSG_CHAR: {
                        if (this._focusedElement() !== "grid") {
                            break;
                        }

                        // Ignore Ctrl/Alt modified characters — those are
                        // keyboard shortcuts (Ctrl+C, Ctrl+V, etc.), not text input.
                        // Without this guard, Ctrl+C would open the editor for 'c'.
                        if (event.lParam & (wakaPAC.KM_CONTROL | wakaPAC.KM_ALT)) {
                            break;
                        }

                        if (event.wParam >= 32) {
                            this._enterEditMode();
                        }

                        break;
                    }

                    // ---------------------------------------------------------
                    // Input complete: sync the formula bar while typing in
                    // the cell editor. A direct DOM write, not a reactive
                    // property write — editorValue itself only updates on
                    // blur (see data-pac-update-mode="change" above), and a
                    // per-keystroke reactive write here would cost the same
                    // full-grid pass anyway. event.detail.value is the
                    // input's current (post-keystroke) value.
                    // ---------------------------------------------------------
                    case wakaPAC.MSG_INPUT_COMPLETE: {
                        if (this._focusedElement() === "editor") {
                            this._formulaInputEl.value = event.detail.value;
                        }

                        break;
                    }

                    // ---------------------------------------------------------
                    // Focus gained: track when the formula bar becomes active
                    // ---------------------------------------------------------
                    case wakaPAC.MSG_SETFOCUS: {
                        if (event.target === this._formulaInputEl) {
                            this._editingFormulaBar = true;
                        }

                        break;
                    }

                    // ---------------------------------------------------------
                    // Focus lost: clear formula bar editing state
                    // ---------------------------------------------------------
                    case wakaPAC.MSG_KILLFOCUS: {
                        if (event.target === this._formulaInputEl) {
                            this._editingFormulaBar = false;
                        }

                        break;
                    }

                    // ---------------------------------------------------------
                    // Paste directly on grid cell
                    // ---------------------------------------------------------
                    case wakaPAC.MSG_PASTE: {
                        if (this._focusedElement() === 'grid') {
                            if (this._setCellData(this.sel.row, this.sel.col, event.detail.text)) {
                                this._recalculateAll();
                            }

                            // Empty patch: refreshes formulaValue in case the
                            // pasted text differs from what's currently shown.
                            this._updateSel({});
                            return false;
                        }

                        break;
                    }
                }
            },

            // =================================================================
            // KEYBOARD HANDLER
            // =================================================================

            /**
             * Routes MSG_KEYDOWN based on which sub-element has focus.
             * The cell editor and formula bar each handle a small set of
             * commit/cancel keys; everything else is grid navigation.
             * @param {CustomEvent} event - The MSG_KEYDOWN PAC event.
             */
            _handleKeyDown(event) {
                const vk    = event.wParam;
                const shift = !!(event.lParam & wakaPAC.KM_SHIFT);
                const ctrl  = !!(event.lParam & wakaPAC.KM_CONTROL);
                const focus = this._focusedElement();

                // ── Cell editor is focused ──
                if (focus === "editor") {
                    switch (vk) {
                        case wakaPAC.VK_RETURN: {
                            this._commitEdit();
                            const next = this._clampedMove(0, shift ? -1 : 1);
                            this._updateSel({ editing: false, col: next.col, row: next.row, endCol: null, endRow: null });
                            this._focusGrid();
                            event.preventDefault();
                            break;
                        }

                        case wakaPAC.VK_TAB: {
                            this._commitEdit();
                            const next = this._clampedMove(shift ? -1 : 1, 0);
                            this._updateSel({ editing: false, col: next.col, row: next.row, endCol: null, endRow: null });
                            this._focusGrid();
                            event.preventDefault();
                            break;
                        }

                        case wakaPAC.VK_ESCAPE: {
                            this._cancelEdit();
                            this._focusGrid();
                            event.preventDefault();
                            break;
                        }
                    }

                    return;
                }

                // ── Formula bar is focused ──
                if (focus === "formulaBar") {
                    switch (vk) {
                        case wakaPAC.VK_RETURN: {
                            this._commitFormulaBar();
                            this._updateSel({});
                            this._focusGrid();
                            event.preventDefault();
                            break;
                        }

                        case wakaPAC.VK_ESCAPE: {
                            this._editingFormulaBar = false;
                            this._updateSel({});
                            this._focusGrid();
                            event.preventDefault();
                            break;
                        }
                    }

                    return;
                }

                // ── Grid is focused — navigation ──
                switch (vk) {
                    case wakaPAC.VK_UP:
                    case wakaPAC.VK_DOWN:
                    case wakaPAC.VK_LEFT:
                    case wakaPAC.VK_RIGHT: {
                        const dc = vk === wakaPAC.VK_LEFT ? -1 : vk === wakaPAC.VK_RIGHT ? 1 : 0;
                        const dr = vk === wakaPAC.VK_UP   ? -1 : vk === wakaPAC.VK_DOWN  ? 1 : 0;

                        if (shift) {
                            // Extend range from current endpoint (or active cell if no range yet)
                            const ec = this.sel.endCol !== null ? this.sel.endCol : this.sel.col;
                            const er = this.sel.endRow !== null ? this.sel.endRow : this.sel.row;

                            this._updateSel({
                                endCol: clamp(ec + dc, 0, NUM_COLS - 1),
                                endRow: clamp(er + dr, 0, NUM_ROWS - 1)
                            });
                        } else {
                            this._moveSelection(dc, dr);
                        }

                        this._scrollToSelection();
                        event.preventDefault();
                        break;
                    }

                    case wakaPAC.VK_TAB: {
                        this._moveSelection(shift ? -1 : 1, 0);
                        this._scrollToSelection();
                        event.preventDefault();
                        break;
                    }

                    case wakaPAC.VK_RETURN: {
                        this._moveSelection(0, shift ? -1 : 1);
                        this._scrollToSelection();
                        event.preventDefault();
                        break;
                    }

                    case wakaPAC.VK_DELETE:
                    case wakaPAC.VK_BACK: {
                        this._clearSelectedCells();
                        event.preventDefault();
                        break;
                    }

                    case wakaPAC.VK_F2: {
                        this._enterEditMode();
                        event.preventDefault();
                        break;
                    }

                    case wakaPAC.VK_HOME: {
                        this._updateSel(ctrl
                            ? { col: 0, row: 0, endCol: null, endRow: null }
                            : { col: 0, endCol: null, endRow: null });

                        this._scrollToSelection();
                        event.preventDefault();
                        break;
                    }

                    case wakaPAC.VK_END: {
                        this._updateSel(ctrl
                            ? { col: NUM_COLS - 1, row: this._getLastUsedRow(), endCol: null, endRow: null }
                            : { col: NUM_COLS - 1, endCol: null, endRow: null });

                        this._scrollToSelection();
                        event.preventDefault();
                        break;
                    }

                    case wakaPAC.VK_A: {
                        if (ctrl) {
                            this._updateSel({ col: 0, row: 0, endCol: NUM_COLS - 1, endRow: NUM_ROWS - 1 });
                            event.preventDefault();
                        }

                        break;
                    }
                }
            },

            // =================================================================
            // CELL DATA
            // =================================================================

            /**
             * Returns the reactive slot object for a data cell.
             * @param {number} row - Row index.
             * @param {number} col - Column index.
             * @returns {{raw: string, value: (string|number), numeric: boolean}}
             */
            _cellSlot(row, col) {
                return this.cellData[row][col];
            },

            /**
             * Mutates a cell's cellData slot in place (never the grid
             * structure — see buildGrid's docstring). Does NOT recalculate
             * formulas itself — callers that set more than one cell (e.g.
             * _clearSelectedCells) should call _recalculateAll() once after
             * the whole batch, not once per cell. WakaPAC's deep reactivity
             * means every touched <td> updates itself — no manual render
             * call needed, but each write here is still its own full
             * reactive-binding re-scan, so batching the recalc matters.
             * @param {number} row - Row index.
             * @param {number} col - Column index.
             * @param {string} raw - Raw input string (empty to clear).
             * @returns {boolean} True if the cell's raw text actually changed.
             */
            _setCellData(row, col, raw) {
                const trimmed = (raw || "").trim();
                const slot = this._cellSlot(row, col);

                if (slot.raw === trimmed) {
                    return false;
                }

                let newSlot;

                if (trimmed === "") {
                    newSlot = { raw: "", value: "", numeric: false, formulaError: false };
                } else if (trimmed.startsWith("=")) {
                    newSlot = { raw: trimmed, value: "", numeric: false, formulaError: false };
                } else {
                    const numeric = isNumeric(trimmed);

                    newSlot = {
                        raw: trimmed,
                        value: numeric ? parseFloat(trimmed) : trimmed,
                        numeric: numeric,
                        formulaError: false
                    };
                }

                // One reactive write (replacing the whole slot) instead of
                // four field writes — see the update-mode comment above for
                // why every write's cost matters, not just the count.
                this.cellData[row][col] = newSlot;

                return true;
            },

            /**
             * Re-runs the formula engine over the whole sheet. See
             * recalculateFormulas — this just points it at this component's
             * cellData.
             */
            _recalculateAll() {
                recalculateFormulas(this.cellData);
            },

            /**
             * Returns the raw input string for a cell.
             * @param {number} row - Row index.
             * @param {number} col - Column index.
             * @returns {string}
             */
            _getRawValue(row, col) {
                return this._cellSlot(row, col).raw;
            },

            /**
             * Applies a partial patch to `sel` via a single reactive write
             * (the whole object is replaced, not individual fields) — see
             * the `sel` docstring for why that's the point. formulaValue is
             * always recomputed from the patched (col, row), so callers
             * never need to remember to sync it themselves.
             * @param {Object} patch - Fields to override on the current `sel`.
             */
            _updateSel(patch) {
                const next = Object.assign({}, this.sel, patch);
                next.formulaValue = this._getRawValue(next.row, next.col);
                this.sel = next;
            },

            // =================================================================
            // SELECTION MANAGEMENT
            // =================================================================

            /**
             * Computes the clamped (col, row) reached by moving the active
             * cell by a delta, without touching reactive state — callers
             * combine this with other patch fields (e.g. editing: false)
             * into a single _updateSel call.
             * @param {number} dc - Column delta.
             * @param {number} dr - Row delta.
             * @returns {{col: number, row: number}}
             */
            _clampedMove(dc, dr) {
                return {
                    col: clamp(this.sel.col + dc, 0, NUM_COLS - 1),
                    row: clamp(this.sel.row + dr, 0, NUM_ROWS - 1)
                };
            },

            /**
             * Moves the active cell by a column/row delta and clears any
             * range, via a single _updateSel write.
             * @param {number} dc - Column delta (-1, 0, or 1).
             * @param {number} dr - Row delta (-1, 0, or 1).
             */
            _moveSelection(dc, dr) {
                const next = this._clampedMove(dc, dr);
                this._updateSel({ col: next.col, row: next.row, endCol: null, endRow: null });
            },

            /**
             * Computes the normalised bounding rectangle of the current selection.
             * Works for both single cells and multi-cell ranges. Called from
             * every header cell's class binding (and, while a range is
             * active, every data cell's) on each reactive pass, so the
             * result is memoized against the four selection fields it
             * depends on — cheap to keep fresh, and avoids rebuilding the
             * same object hundreds of times per pass.
             * @returns {{ minCol: number, maxCol: number, minRow: number, maxRow: number }}
             */
            _rangeBounds() {
                const s = this.sel;
                const key = s.col + "," + s.row + "," + s.endCol + "," + s.endRow;

                if (this._boundsCacheKey === key) {
                    return this._boundsCache;
                }

                const c2 = s.endCol !== null ? s.endCol : s.col;
                const r2 = s.endRow !== null ? s.endRow : s.row;

                this._boundsCache = {
                    minCol: Math.min(s.col, c2), maxCol: Math.max(s.col, c2),
                    minRow: Math.min(s.row, r2), maxRow: Math.max(s.row, r2)
                };
                this._boundsCacheKey = key;

                return this._boundsCache;
            },

            /**
             * Tests whether the current selection spans more than one cell.
             * @returns {boolean}
             */
            _isRangeSelection() {
                const s = this.sel;
                return s.endCol !== null && s.endRow !== null && (s.endCol !== s.col || s.endRow !== s.row);
            },

            /**
             * Per-cell binding helper: is (row, col) the active cell?
             * @param {number} row
             * @param {number} col
             * @returns {boolean}
             */
            isCellSelected(row, col) {
                return row === this.sel.row && col === this.sel.col;
            },

            /**
             * Per-cell binding helper: is (row, col) inside the current range
             * (when one is active)?
             * @param {number} row
             * @param {number} col
             * @returns {boolean}
             */
            isCellInRange(row, col) {
                if (!this._isRangeSelection()) {
                    return false;
                }

                const b = this._rangeBounds();
                return row >= b.minRow && row <= b.maxRow && col >= b.minCol && col <= b.maxCol;
            },

            /**
             * Column-header binding helper: does the current selection span this column?
             * @param {number} col
             * @returns {boolean}
             */
            isColActive(col) {
                const b = this._rangeBounds();
                return col >= b.minCol && col <= b.maxCol;
            },

            /**
             * Row-header binding helper: does the current selection span this row?
             * @param {number} row
             * @returns {boolean}
             */
            isRowActive(row) {
                const b = this._rangeBounds();
                return row >= b.minRow && row <= b.maxRow;
            },

            /**
             * Scrolls the grid so the active cell is visible.
             */
            _scrollToSelection() {
                const cell = this._scrollArea.querySelector(
                    `.cell[data-row="${this.sel.row}"][data-col="${this.sel.col}"]`
                );

                if (cell) {
                    cell.scrollIntoView({ block: "nearest", inline: "nearest" });
                }
            },

            // =================================================================
            // EDIT MODE
            // =================================================================

            /**
             * Opens the inline cell editor. Optionally also moves the
             * selection to a new position first (used by double-click,
             * which selects and edits in one gesture) — folded into the
             * SAME _updateSel write rather than two. Position comes from
             * the editorStyle computed; only focus/cursor placement stay
             * imperative here. That must happen synchronously (no
             * rAF/setTimeout deferral): when opened from MSG_CHAR, the
             * physical keypress that opens the editor is what types the
             * first character, and it only lands in the editor because
             * focus moves there before that keypress's native
             * character-insertion fires.
             * @param {{col: number, row: number}} [position] - Cell to edit;
             *   defaults to the current selection (F2, typing a character).
             */
            _enterEditMode(position) {
                const col = position ? position.col : this.sel.col;
                const row = position ? position.row : this.sel.row;
                const raw = this._getRawValue(row, col);

                this._updateSel({
                    col: col, row: row, endCol: null, endRow: null,
                    editing: true, editorValue: raw
                });

                this._editorInput.focus();
                const len = this._editorInput.value.length;
                this._editorInput.setSelectionRange(len, len);
            },

            /**
             * Commits the cell editor's current value to the cell and
             * closes it. Doesn't touch `sel.editing` or the formula bar
             * itself — every caller folds those into its own _updateSel
             * call right afterward (often combined with a selection move),
             * so this doesn't spend a separate reactive pass on a value
             * that call immediately overwrites.
             */
            _commitEdit() {
                if (!this.sel.editing) {
                    return;
                }

                // Read the input's live DOM value, not the reactive
                // sel.editorValue — with update-mode "change" that property
                // only refreshes on blur, which hasn't happened yet here
                // (focus moves away *after* this call returns).
                if (this._setCellData(this.sel.row, this.sel.col, this._editorInput.value)) {
                    this._recalculateAll();
                }
            },

            /**
             * Discards the cell editor's value and closes it without saving.
             */
            _cancelEdit() {
                this._updateSel({ editing: false });
            },

            /**
             * Commits the formula bar's current value to the active cell.
             * Same reasoning as _commitEdit: callers handle their own
             * _updateSel afterward.
             */
            _commitFormulaBar() {
                this._editingFormulaBar = false;

                // Read the live DOM value, since sel.formulaValue itself
                // only refreshes on blur.
                if (this._setCellData(this.sel.row, this.sel.col, this._formulaInputEl.value)) {
                    this._recalculateAll();
                }
            },

            // =================================================================
            // HIT TESTING
            // =================================================================

            /**
             * Extracts cell coordinates from a PAC event's target element.
             * Returns null if the target is not a data cell.
             * @param {CustomEvent} event - PAC event.
             * @returns {{ col: number, row: number }|null}
             */
            _hitTest(event) {
                const target = event.target || event.originalEvent?.target;

                if (!target || !target.classList?.contains("cell")) {
                    return null;
                }

                return {
                    col: parseInt(target.dataset.col, 10),
                    row: parseInt(target.dataset.row, 10)
                };
            },

            /**
             * Resolves cell coordinates from viewport pixel coordinates.
             * Used during drag-select where the cursor may be over any element.
             * @param {number} clientX - Viewport X.
             * @param {number} clientY - Viewport Y.
             * @returns {{ col: number, row: number }|null}
             */
            _hitTestCoords(clientX, clientY) {
                const el = document.elementFromPoint(clientX, clientY);

                if (!el || !el.classList?.contains("cell")) {
                    return null;
                }

                return {
                    col: parseInt(el.dataset.col, 10),
                    row: parseInt(el.dataset.row, 10)
                };
            },

            // =================================================================
            // CLEAR / DELETE
            // =================================================================

            /**
             * Clears all cells within the current selection range.
             */
            _clearSelectedCells() {
                const b = this._rangeBounds();
                let anyChanged = false;

                // One recalculate after the whole range, not one per cell —
                // _setCellData no longer does it itself for exactly this reason.
                for (let r = b.minRow; r <= b.maxRow; r++) {
                    for (let c = b.minCol; c <= b.maxCol; c++) {
                        anyChanged = this._setCellData(r, c, "") || anyChanged;
                    }
                }

                if (anyChanged) {
                    this._recalculateAll();
                }

                this._updateSel({});
            },

            /**
             * Finds the last row that contains data. Used by Ctrl+End.
             * @returns {number} Zero-based row index.
             */
            _getLastUsedRow() {
                for (let r = this.cellData.length - 1; r >= 0; r--) {
                    for (let c = 0; c < NUM_COLS; c++) {
                        if (this._cellSlot(r, c).raw !== "") {
                            return r;
                        }
                    }
                }

                return 0;
            }
        });

    })();
</script>
</body>
</html>
