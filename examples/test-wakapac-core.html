<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WakaPAC core — test suite</title>
    <style>
        body { font-family: monospace; padding: 2rem; background: #1e1e1e; color: #d4d4d4; }
        h1   { color: #9cdcfe; margin-bottom: 0.25rem; font-size: 1.1rem; }
        p.subtitle { color: #6a9955; margin-top: 0; margin-bottom: 2rem; font-size: 0.85rem; }

        #results { display: flex; flex-direction: column; gap: 0.35rem; }
        #fixtures { position: absolute; left: -9999px; top: -9999px; }

        .suite  { color: #569cd6; margin-top: 1rem; margin-bottom: 0.2rem; font-weight: bold; }
        .pass   { color: #4ec9b0; }
        .pass::before { content: '✓ '; }
        .fail   { color: #f44747; }
        .fail::before { content: '✗ '; }
        .info   { color: #808080; padding-left: 1.5rem; font-size: 0.85rem; }

        #summary {
            margin-top: 2rem;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            font-weight: bold;
        }
        #summary.all-pass { background: #1e3a2f; color: #4ec9b0; }
        #summary.has-fail { background: #3a1e1e; color: #f44747; }
    </style>
</head>
<body>

<h1>WakaPAC core — test suite</h1>
<p class="subtitle">Open DevTools console for detailed failure output</p>
<div id="results"></div>
<div id="summary"></div>

<!-- Fixtures are created/removed per test; kept off-screen rather than
     hidden so layout-dependent bindings (e.g. focus, viewport) still work. -->
<div id="fixtures"></div>

<script src="../wakapac.js"></script>

<script>
    (function () {
        'use strict';

        // ─── Mini test runner (mirrors test-wakaform.html / test-wakastore.html) ──

        const results  = document.getElementById('results');
        const summary  = document.getElementById('summary');
        const fixtures = document.getElementById('fixtures');
        let passed = 0;
        let failed = 0;
        let currentSuite = null;

        function suite(name) {
            currentSuite = name;
            const el = document.createElement('div');
            el.className = 'suite';
            el.textContent = name;
            results.appendChild(el);
        }

        function pass(name) {
            passed++;
            const el = document.createElement('div');
            el.className = 'pass';
            el.textContent = name;
            results.appendChild(el);
        }

        function fail(name, reason) {
            failed++;
            console.error('[FAIL]', currentSuite, '>', name, '\n', reason);
            const el = document.createElement('div');
            el.className = 'fail';
            el.textContent = name;
            results.appendChild(el);
            const info = document.createElement('div');
            info.className = 'info';
            info.textContent = String(reason);
            results.appendChild(info);
        }

        function assert(condition, message) {
            if (!condition) throw new Error('Assertion failed: ' + message);
        }

        function assertEqual(actual, expected, label) {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                throw new Error(
                    (label || 'assertEqual') +
                    '\n  expected: ' + JSON.stringify(expected) +
                    '\n  actual:   ' + JSON.stringify(actual)
                );
            }
        }

        async function test(name, fn) {
            try {
                await fn();
                pass(name);
            } catch (e) {
                fail(name, e.message || e);
            }
        }

        // ─── Helpers ─────────────────────────────────────────────────────────────

        /**
         * Waits past WakaPAC's internal batching windows so pending DOM
         * updates have flushed. Component hierarchy/initial-bind establishment
         * is debounced by 10ms (see establishAllHierarchies in wakapac.js);
         * 50ms gives comfortable margin under headless/CI load.
         */
        function tick() {
            return new Promise(function (resolve) { setTimeout(resolve, 50); });
        }

        /** Dispatches a bubbling synthetic mousemove with `el` as event.target. */
        function moveOver(el) {
            el.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: 0, clientY: 0 }));
        }

        /**
         * Waits past the mousemove coalescer's requestAnimationFrame-based
         * throttle (see setupMoveCoalescer in wakapac.js) so a dispatched
         * mousemove has been processed.
         */
        function flushMouseMove() {
            return new Promise(function (resolve) {
                requestAnimationFrame(function () { requestAnimationFrame(resolve); });
            }).then(tick);
        }

        let fixtureCounter = 0;

        /**
         * Creates a fixture container with the given innerHTML, mounts it via
         * wakaPAC(), and returns { pacId, container, abstraction, destroy }.
         * destroy() removes the container from the DOM (triggering WakaPAC's
         * MutationObserver-based cleanup) so the caller doesn't leak components
         * across tests.
         */
        function mount(html, abstraction, options) {
            const pacId = 'core-fixture-' + (++fixtureCounter);
            const container = document.createElement('div');
            container.id = pacId;
            container.innerHTML = html;
            fixtures.appendChild(container);

            const result = wakaPAC('#' + pacId, abstraction, options);

            return {
                pacId: pacId,
                container: container,
                abstraction: result,
                destroy: function () {
                    if (container.parentNode) {
                        container.parentNode.removeChild(container);
                    }
                }
            };
        }

        // ─── Suites ─────────────────────────────────────────────────────────────

        async function runAll() {

            suite('Component creation & interpolation');

            await test('renders {{ }} interpolation with initial value', async function () {
                const c = mount('<p id="out">{{count}}</p>', { count: 5 });
                await tick();
                assertEqual(c.container.querySelector('#out').textContent, '5');
                c.destroy();
            });

            await test('property change updates interpolated text', async function () {
                const c = mount('<p id="out">{{count}}</p>', { count: 0 });
                await tick();
                c.abstraction.count = 42;
                await tick();
                assertEqual(c.container.querySelector('#out').textContent, '42');
                c.destroy();
            });

            await test('component-ready event fires with the correct pacId', async function () {
                let seen = null;
                function handler(e) { seen = e.detail; }
                document.addEventListener('pac:component-ready', handler);
                const c = mount('<p>{{count}}</p>', { count: 0 });
                document.removeEventListener('pac:component-ready', handler);
                assert(seen !== null, 'event fired');
                assertEqual(seen.pacId, c.pacId, 'pacId matches');
                c.destroy();
            });

            suite('Two-way value binding');

            await test('abstraction change updates bound input value', async function () {
                const c = mount('<input id="inp" data-pac-bind="value: name">', { name: 'a' });
                await tick();
                c.abstraction.name = 'b';
                await tick();
                assertEqual(c.container.querySelector('#inp').value, 'b');
                c.destroy();
            });

            await test('user input updates the abstraction property', async function () {
                const c = mount('<input id="inp" data-pac-bind="value: name">', { name: '' });
                await tick();
                const input = c.container.querySelector('#inp');
                input.value = 'typed';
                input.dispatchEvent(new Event('input', { bubbles: true }));
                await tick();
                assertEqual(c.abstraction.name, 'typed');
                c.destroy();
            });

            suite('Computed properties');

            await test('computed recalculates when its dependency changes', async function () {
                const c = mount('<p id="out">{{doubled}}</p>', {
                    count: 3,
                    computed: { doubled() { return this.count * 2; } }
                });
                await tick();
                assertEqual(c.container.querySelector('#out').textContent, '6');
                c.abstraction.count = 10;
                await tick();
                assertEqual(c.container.querySelector('#out').textContent, '20');
                c.destroy();
            });

            suite('Array reactivity (foreach)');

            await test('foreach renders one element per array item', async function () {
                const c = mount(
                    '<ul data-pac-bind="foreach: items" data-pac-item="item">' +
                    '<li>{{item.label}}</li></ul>',
                    { items: [{ label: 'a' }, { label: 'b' }] }
                );
                await tick();
                assertEqual(c.container.querySelectorAll('li').length, 2);
                c.destroy();
            });

            await test('push() adds a rendered element', async function () {
                const c = mount(
                    '<ul data-pac-bind="foreach: items" data-pac-item="item">' +
                    '<li>{{item.label}}</li></ul>',
                    { items: [{ label: 'a' }] }
                );
                c.abstraction.items.push({ label: 'b' });
                await tick();
                assertEqual(c.container.querySelectorAll('li').length, 2);
                c.destroy();
            });

            await test('splice() removes a rendered element', async function () {
                const c = mount(
                    '<ul data-pac-bind="foreach: items" data-pac-item="item">' +
                    '<li>{{item.label}}</li></ul>',
                    { items: [{ label: 'a' }, { label: 'b' }] }
                );
                c.abstraction.items.splice(0, 1);
                await tick();
                const lis = c.container.querySelectorAll('li');
                assertEqual(lis.length, 1);
                assertEqual(lis[0].textContent, 'b');
                c.destroy();
            });

            await test('function call with item argument in interpolation does not warn on initial render (issue #196)', async function () {
                const originalWarn = console.warn;
                const warnings = [];
                console.warn = function () { warnings.push(Array.prototype.join.call(arguments, ' ')); };

                let c;
                try {
                    c = mount(
                        '<ul data-pac-bind="foreach: items" data-pac-item="item">' +
                        '<li>{{format(item)}}</li></ul>',
                        {
                            items: [{ name: 'chair', value: 14 }, { name: 'painting', value: 260 }],
                            format(item) { return item.name + ' = ' + item.value; }
                        }
                    );
                    await tick();
                } finally {
                    console.warn = originalWarn;
                }

                const interpolationWarnings = warnings.filter(function (w) {
                    return w.indexOf('Error in text interpolation') !== -1;
                });

                assertEqual(interpolationWarnings, [], 'no interpolation warnings during initial foreach render');

                const lis = c.container.querySelectorAll('li');
                assertEqual(lis.length, 2);
                assertEqual(lis[0].textContent, 'chair = 14');
                assertEqual(lis[1].textContent, 'painting = 260');
                c.destroy();
            });

            await test('function call with item argument in interpolation does not warn on an empty array (issue #196)', async function () {
                const originalWarn = console.warn;
                const warnings = [];
                console.warn = function () { warnings.push(Array.prototype.join.call(arguments, ' ')); };

                let c;
                try {
                    c = mount(
                        '<ul data-pac-bind="foreach: items" data-pac-item="item">' +
                        '<li>{{format(item)}}</li></ul>',
                        {
                            items: [],
                            format(item) { return item.name + ' = ' + item.value; }
                        }
                    );
                    await tick();
                } finally {
                    console.warn = originalWarn;
                }

                const interpolationWarnings = warnings.filter(function (w) {
                    return w.indexOf('Error in text interpolation') !== -1;
                });

                assertEqual(interpolationWarnings, [], 'no interpolation warnings when the foreach array is empty');
                assertEqual(c.container.querySelectorAll('li').length, 0);
                c.destroy();
            });

            await test('function call with item argument in one foreach is unaffected by a sibling foreach in the same container (issue #201)', async function () {
                const originalWarn = console.warn;
                const warnings = [];
                console.warn = function () { warnings.push(Array.prototype.join.call(arguments, ' ')); };

                let c;
                try {
                    c = mount(
                        '<ul data-pac-bind="foreach: items" data-pac-item="item">' +
                        '<li>{{item.n}}</li></ul>' +
                        '<ul data-pac-bind="foreach: items" data-pac-item="item">' +
                        '<li>{{format(item)}}</li></ul>',
                        {
                            items: [{ n: 1 }, { n: 2 }],
                            format(item) { return 'Item: ' + item.n; }
                        }
                    );
                    await tick();
                } finally {
                    console.warn = originalWarn;
                }

                const interpolationWarnings = warnings.filter(function (w) {
                    return w.indexOf('interpolation') !== -1;
                });

                assertEqual(interpolationWarnings, [], 'no interpolation warnings from the sibling foreach with a function call');

                const lists = c.container.querySelectorAll('ul');
                const firstLis = lists[0].querySelectorAll('li');
                const secondLis = lists[1].querySelectorAll('li');

                assertEqual(firstLis.length, 2);
                assertEqual(firstLis[0].textContent, '1');
                assertEqual(firstLis[1].textContent, '2');

                assertEqual(secondLis.length, 2);
                assertEqual(secondLis[0].textContent, 'Item: 1');
                assertEqual(secondLis[1].textContent, 'Item: 2');

                c.destroy();
            });

            await test('foreach on a computed array built via .map() binds item to the transformed value, not the source array (issue #198)', async function () {
                const c = mount(
                    '<ul data-pac-bind="foreach: gadgets">' +
                    '<li>{{item.name}}</li></ul>',
                    {
                        items: [1, 2],
                        computed: {
                            gadgets() {
                                return this.items.map(function (item) {
                                    return { name: 'Gadget #' + item };
                                });
                            }
                        }
                    }
                );
                await tick();
                const lis = c.container.querySelectorAll('li');
                assertEqual(lis.length, 2);
                assertEqual(lis[0].textContent, 'Gadget #1');
                assertEqual(lis[1].textContent, 'Gadget #2');
                c.destroy();
            });

            await test('foreach on a computed array built via .filter() still maps item back to the source array', async function () {
                const c = mount(
                    '<ul data-pac-bind="foreach: visible">' +
                    '<li>{{item.label}}</li></ul>',
                    {
                        todos: [
                            { label: 'a', done: false },
                            { label: 'b', done: true },
                            { label: 'c', done: false }
                        ],
                        computed: {
                            visible() {
                                return this.todos.filter(function (t) { return !t.done; });
                            }
                        }
                    }
                );
                await tick();
                const lis = c.container.querySelectorAll('li');
                assertEqual(lis.length, 2);
                assertEqual(lis[0].textContent, 'a');
                assertEqual(lis[1].textContent, 'c');
                c.destroy();
            });

            await test('foreach on a computed that branches between .filter() (identity-preserving) and .map() (not) rebinds correctly after the branch flips (regression: inferArrayRoot cache must not survive a data change)', async function () {
                const c = mount(
                    '<ul data-pac-bind="foreach: display">' +
                    '<li>{{item.label}}</li></ul>',
                    {
                        todos: [
                            { label: 'a', done: false },
                            { label: 'b', done: true }
                        ],
                        grouped: false,
                        computed: {
                            display() {
                                return this.grouped
                                    ? this.todos.map(function (t) { return { label: 'grouped-' + t.label }; })
                                    : this.todos.filter(function (t) { return !t.done; });
                            }
                        }
                    }
                );
                await tick();

                // Initial render takes the .filter() branch: its output is
                // identity-preserving, so inferArrayRoot() resolves and caches
                // "todos" as the source root.
                let lis = c.container.querySelectorAll('li');
                assertEqual(lis.length, 1, 'filter branch renders one visible todo');
                assertEqual(lis[0].textContent, 'a');

                // Flip to the .map() branch: the computed's output is no longer
                // identity-preserving. If the cache from the filter branch were
                // reused instead of being recomputed, foreach would map "item"
                // back to the raw todo object instead of the transformed one.
                c.abstraction.grouped = true;
                await tick();
                lis = c.container.querySelectorAll('li');
                assertEqual(lis.length, 2, 'map branch renders both transformed items');
                assertEqual(lis[0].textContent, 'grouped-a');
                assertEqual(lis[1].textContent, 'grouped-b');
                c.destroy();
            });

            await test('foreach on a nested path rebuilds render length when the parent object is reassigned (issue #204)', async function () {
                const c = mount(
                    '<ul data-pac-bind="foreach: data.items" data-pac-item="item">' +
                    '<li>{{item.name}}</li></ul>',
                    { data: { items: [{ name: '1' }] } }
                );
                await tick();
                assertEqual(c.container.querySelectorAll('li').length, 1, 'initial render');

                // Reassign the parent — "data" changed, not "data.items" directly.
                c.abstraction.data = { items: [{ name: '1' }, { name: '2' }] };
                await tick();
                let lis = c.container.querySelectorAll('li');
                assertEqual(lis.length, 2, 'grows to match the new array after parent reassignment');
                assertEqual(lis[0].textContent, '1');
                assertEqual(lis[1].textContent, '2');

                c.abstraction.data.items = [{ name: '3' }, { name: '4' }, { name: '5' }];
                await tick();
                lis = c.container.querySelectorAll('li');
                assertEqual(lis.length, 3, 'direct nested-array replacement still resizes correctly');

                // Reassign the parent again, shrinking the array.
                c.abstraction.data = { items: [{ name: '6' }, { name: '7' }] };
                await tick();
                lis = c.container.querySelectorAll('li');
                assertEqual(lis.length, 2, 'shrinks to match the new array after a second parent reassignment');
                assertEqual(lis[0].textContent, '6');
                assertEqual(lis[1].textContent, '7');

                c.abstraction.data = { items: [] };
                await tick();
                assertEqual(c.container.querySelectorAll('li').length, 0, 'shrinks to zero for an empty array');

                c.destroy();
            });

            await test('foreach is not rebuilt when an unrelated sibling property changes (regression guard for issue #204 fix)', async function () {
                const c = mount(
                    '<ul data-pac-bind="foreach: data.items" data-pac-item="item">' +
                    '<li>{{item.name}}</li></ul>',
                    { data: { items: [{ name: 'a' }], other: 1 } }
                );
                await tick();

                const list = c.container.querySelector('ul');
                const firstLi = list.querySelector('li');

                c.abstraction.data.other = 2;
                await tick();

                assertEqual(c.container.querySelectorAll('li').length, 1, 'render length unaffected');
                assert(c.container.querySelector('li') === firstLi, 'rendered <li> node was not rebuilt');

                c.destroy();
            });

            suite('Click bindings & msgProc');

            await test('click binding invokes the bound method', async function () {
                let calls = 0;
                const c = mount('<button id="btn" data-pac-bind="click: bump">+</button>', {
                    bump() { calls++; }
                });
                await tick();
                c.container.querySelector('#btn').click();
                assertEqual(calls, 1);
                c.destroy();
            });

            await test('msgProc receives MSG_TIMER after setTimer', async function () {
                const c = mount('<p>timer</p>', {
                    ticks: 0,
                    msgProc(message) {
                        if (message.message === wakaPAC.MSG_TIMER) {
                            this.ticks++;
                        }
                    }
                });
                await tick();
                const timerId = wakaPAC.setTimer(c.pacId, 10);
                await new Promise(function (resolve) { setTimeout(resolve, 60); });
                wakaPAC.killTimer(c.pacId, timerId);
                assert(c.abstraction.ticks > 0, 'at least one MSG_TIMER delivered, got ' + c.abstraction.ticks);
                c.destroy();
            });

            suite('Accelerator tables');

            await test('MSG_ACCEL from a container\'s own table fires in its own msgProc', async function () {
                const CMD_SAVE = 1;
                const c = mount('<input id="accelInput">', {
                    received: null,
                    msgProc(message) {
                        if (message.message === wakaPAC.MSG_ACCEL) {
                            this.received = message.wParam;
                        }
                    }
                });
                await tick();
                wakaPAC.loadAcceleratorTable(c.pacId, [{ key: 'Ctrl+S', cmdId: CMD_SAVE }]);
                c.container.querySelector('#accelInput').dispatchEvent(
                    new KeyboardEvent('keydown', { bubbles: true, code: 'KeyS', ctrlKey: true })
                );
                await tick();
                assertEqual(c.abstraction.received, CMD_SAVE, 'own table matched and delivered to itself');
                wakaPAC.destroyAcceleratorTable(c.pacId);
                c.destroy();
            });

            await test('MSG_ACCEL from a parent\'s table is delivered to the parent, not a focused child with no table of its own', async function () {
                // Regression test: _accelTablesForContainer() walks up to ancestor
                // tables, but _translateAccelerator() used to always send MSG_ACCEL
                // to the originally focused (child) container's pacId regardless of
                // which table matched -- so a shortcut resolved via a parent's table
                // never actually reached the parent's msgProc. See MsgProcAcceleratorTables.html
                // "Nested Containers".
                const CMD_SAVE = 1;
                const parentId = 'core-fixture-accel-parent-' + (++fixtureCounter);
                const childId = 'core-fixture-accel-child-' + fixtureCounter;

                const container = document.createElement('div');
                container.id = parentId;
                container.innerHTML = '<div id="' + childId + '"><input id="accelChildInput"></div>';
                fixtures.appendChild(container);

                const parent = wakaPAC('#' + parentId, {
                    received: null,
                    msgProc(message) {
                        if (message.message === wakaPAC.MSG_ACCEL) {
                            this.received = message.wParam;
                        }
                    }
                });

                const child = wakaPAC('#' + childId, {
                    received: null,
                    msgProc(message) {
                        if (message.message === wakaPAC.MSG_ACCEL) {
                            this.received = message.wParam;
                        }
                    }
                });

                await tick();

                wakaPAC.loadAcceleratorTable(parentId, [{ key: 'Ctrl+S', cmdId: CMD_SAVE }]);

                container.querySelector('#accelChildInput').dispatchEvent(
                    new KeyboardEvent('keydown', { bubbles: true, code: 'KeyS', ctrlKey: true })
                );
                await tick();

                assertEqual(parent.received, CMD_SAVE, 'parent msgProc received MSG_ACCEL, got ' + JSON.stringify({ parent: parent.received, child: child.received }));
                assertEqual(child.received, null, 'child msgProc did not receive MSG_ACCEL (no table of its own)');

                wakaPAC.destroyAcceleratorTable(parentId);
                container.parentNode.removeChild(container);
            });

            suite('Mouse hover bindings (mouseenter/mouseleave)');

            await test('mouseenter/mouseleave bindings invoke bound methods on real hover, not on mount (issue #206)', async function () {
                const c = mount(
                    '<div id="outer">outer<div id="hoverme" data-pac-bind="mouseenter: enter, mouseleave: leave">hover me</div></div>',
                    {
                        enters: 0,
                        leaves: 0,
                        enter() { this.enters++; },
                        leave() { this.leaves++; }
                    }
                );
                await tick();
                assertEqual(c.abstraction.enters, 0, 'mouseenter must not fire on mount');
                assertEqual(c.abstraction.leaves, 0, 'mouseleave must not fire on mount');

                moveOver(c.container.querySelector('#hoverme'));
                await flushMouseMove();
                assertEqual(c.abstraction.enters, 1, 'mouseenter fires once when the pointer enters the element');
                assertEqual(c.abstraction.leaves, 0, 'mouseleave has not fired yet');

                moveOver(c.container.querySelector('#outer'));
                await flushMouseMove();
                assertEqual(c.abstraction.enters, 1, 'mouseenter does not re-fire on an unrelated move');
                assertEqual(c.abstraction.leaves, 1, 'mouseleave fires once when the pointer leaves the element');

                c.destroy();
            });

            await test('mouseenter binding supports a bare method reference without parentheses (issue #206)', async function () {
                const c = mount(
                    '<div id="hoverme2" data-pac-bind="mouseenter: enter">hover</div>',
                    {
                        enters: 0,
                        enter() { this.enters++; }
                    }
                );
                await tick();
                moveOver(c.container.querySelector('#hoverme2'));
                await flushMouseMove();
                assertEqual(c.abstraction.enters, 1, 'a bare method reference (no parentheses) is still invoked on mouseenter');
                c.destroy();
            });

            await test('mouseenter/mouseleave bindings are not applied to the DOM as literal attributes', async function () {
                const c = mount(
                    '<div id="hoverme3" data-pac-bind="mouseenter: enter, mouseleave: leave">hover</div>',
                    { enter() {}, leave() {} }
                );
                await tick();
                const el = c.container.querySelector('#hoverme3');
                assert(!el.hasAttribute('mouseenter'), 'mouseenter must not be set as a literal DOM attribute');
                assert(!el.hasAttribute('mouseleave'), 'mouseleave must not be set as a literal DOM attribute');
                c.destroy();
            });

            await test('a nested reactive-attribute binding (e.g. css) does not shadow an ancestor mouseenter/mouseleave binding', async function () {
                // The icon is bound via a plain reactive attribute, not an event
                // binding. It must be transparent to hover hit-testing so the
                // button underneath it keeps tracking as the hovered descendant
                // instead of the icon spuriously becoming its own boundary.
                const c = mount(
                    '<div id="outer">outer' +
                    '<button id="hoverbtn" data-pac-bind="mouseenter: enter, mouseleave: leave">' +
                    '<span id="hovericon" data-pac-bind="css: iconClass"></span>' +
                    '</button></div>',
                    {
                        enters: 0,
                        leaves: 0,
                        iconClass: 'icon',
                        enter() { this.enters++; },
                        leave() { this.leaves++; }
                    }
                );
                await tick();

                moveOver(c.container.querySelector('#hoverbtn'));
                await flushMouseMove();
                assertEqual(c.abstraction.enters, 1, 'mouseenter fires once when the pointer enters the button');
                assertEqual(c.abstraction.leaves, 0, 'mouseleave has not fired yet');

                moveOver(c.container.querySelector('#hovericon'));
                await flushMouseMove();
                assertEqual(c.abstraction.enters, 1, 'mouseenter does not re-fire when moving onto the nested css-bound icon');
                assertEqual(c.abstraction.leaves, 0, 'mouseleave must not fire when the pointer is still over the button, just on the icon');

                moveOver(c.container.querySelector('#outer'));
                await flushMouseMove();
                assertEqual(c.abstraction.enters, 1, 'mouseenter still fired only once overall');
                assertEqual(c.abstraction.leaves, 1, 'mouseleave fires once when the pointer actually leaves the button');

                c.destroy();
            });

            await test('nested mouseenter/mouseleave bindings hold independent hover state (issue: outer must not leave when the pointer enters a bound descendant)', async function () {
                // Unlike the css:-bound icon above, the button has its own real
                // mouseenter/mouseleave binding — both elements must track hover independently.
                const c = mount(
                    '<div id="outerHover" data-pac-bind="mouseenter: outerEnter, mouseleave: outerLeave">outer' +
                    '<button id="innerHover" data-pac-bind="mouseenter: innerEnter, mouseleave: innerLeave">inner</button>' +
                    '</div>',
                    {
                        outerEnters: 0, outerLeaves: 0, innerEnters: 0, innerLeaves: 0,
                        outerEnter() { this.outerEnters++; },
                        outerLeave() { this.outerLeaves++; },
                        innerEnter() { this.innerEnters++; },
                        innerLeave() { this.innerLeaves++; }
                    }
                );
                await tick();

                // Enter the outer div, off the button.
                moveOver(c.container.querySelector('#outerHover'));
                await flushMouseMove();
                assertEqual(c.abstraction.outerEnters, 1, 'outer mouseenter fires once entering the div');
                assertEqual(c.abstraction.innerEnters, 0, 'inner has not been entered yet');

                // Move onto the nested button — must not fire the outer's mouseleave.
                moveOver(c.container.querySelector('#innerHover'));
                await flushMouseMove();
                assertEqual(c.abstraction.outerEnters, 1, 'outer mouseenter does not re-fire moving onto the nested button');
                assertEqual(c.abstraction.outerLeaves, 0, 'outer mouseleave must not fire — the pointer is still within the div, just over the nested button');
                assertEqual(c.abstraction.innerEnters, 1, 'inner mouseenter fires once entering the button');

                // Back onto the div, off the button.
                moveOver(c.container.querySelector('#outerHover'));
                await flushMouseMove();
                assertEqual(c.abstraction.outerEnters, 1, 'outer mouseenter still fired only once overall');
                assertEqual(c.abstraction.innerLeaves, 1, 'inner mouseleave fires once when the pointer leaves the button back onto the div');

                // Leave the component entirely.
                moveOver(fixtures);
                await flushMouseMove();
                assertEqual(c.abstraction.outerLeaves, 1, 'outer mouseleave fires once when the pointer actually leaves the div');
                assertEqual(c.abstraction.innerLeaves, 1, 'inner mouseleave still fired only once overall');

                c.destroy();
            });

            suite('Additional named event bindings (dblclick/mousedown/mouseup/contextmenu/wheel/keydown/...)');

            await test('dblclick binding invokes the bound method on a real dblclick, not on mount or unrelated changes', async function () {
                const c = mount(
                    '<span>{{counter}}</span><button id="dbl" data-pac-bind="dblclick: onDblClick()">button</button>',
                    {
                        counter: 0,
                        calls: 0,
                        onDblClick() { this.calls++; }
                    }
                );
                await tick();
                assertEqual(c.abstraction.calls, 0, 'must not fire on mount');

                c.abstraction.counter++;
                c.abstraction.counter++;
                await tick();
                assertEqual(c.abstraction.calls, 0, 'must not fire from an unrelated reactive change');

                c.container.querySelector('#dbl').dispatchEvent(new MouseEvent('dblclick', { bubbles: true, button: 0 }));
                await tick();
                assertEqual(c.abstraction.calls, 1, 'fires exactly once on a real dblclick');
                c.destroy();
            });

            await test('dblclick binding supports a bare method reference without parentheses', async function () {
                const c = mount(
                    '<button id="dblBare" data-pac-bind="dblclick: onDblClick">button</button>',
                    { calls: 0, onDblClick() { this.calls++; } }
                );
                await tick();
                c.container.querySelector('#dblBare').dispatchEvent(new MouseEvent('dblclick', { bubbles: true, button: 0 }));
                await tick();
                assertEqual(c.abstraction.calls, 1, 'a bare method reference is still invoked on a real dblclick');
                c.destroy();
            });

            await test('dblclick binding on an icon-wrapping button shadows $event.target to the bound button', async function () {
                const c = mount(
                    '<button id="dblIcon" data-pac-bind="dblclick: onDblClick($event)"><span id="icon">*</span></button>',
                    { seenId: null, onDblClick(event) { this.seenId = event.target.id; } }
                );
                await tick();
                c.container.querySelector('#icon').dispatchEvent(new MouseEvent('dblclick', { bubbles: true, button: 0 }));
                await tick();
                assertEqual(c.abstraction.seenId, 'dblIcon', '$event.target resolves to the bound button, not the decorative icon');
                c.destroy();
            });

            await test('dblclick binding inside a foreach receives $item/$index, matching click', async function () {
                const c = mount(
                    '<ul data-pac-bind="foreach: items" data-pac-item="item">' +
                    '<li data-pac-bind="dblclick: onDblClick($item, $index)">{{item.label}}</li></ul>',
                    {
                        items: [{ label: 'a' }, { label: 'b' }],
                        seen: null,
                        onDblClick(item, index) { this.seen = `${item.label}:${index}`; }
                    }
                );
                await tick();
                c.container.querySelectorAll('li')[1].dispatchEvent(new MouseEvent('dblclick', { bubbles: true, button: 0 }));
                await tick();
                assertEqual(c.abstraction.seen, 'b:1', '$item and $index resolve to the clicked row, not the outer scope');
                c.destroy();
            });

            await test('dblclick binding inside a foreach falls back to (event, item, index) for a bare method reference', async function () {
                const c = mount(
                    '<ul data-pac-bind="foreach: items" data-pac-item="item">' +
                    '<li data-pac-bind="dblclick: onDblClick">{{item.label}}</li></ul>',
                    {
                        items: [{ label: 'a' }, { label: 'b' }],
                        seen: null,
                        onDblClick(event, item, index) { this.seen = `${event.originalEvent.type}:${item.label}:${index}`; }
                    }
                );
                await tick();
                c.container.querySelectorAll('li')[0].dispatchEvent(new MouseEvent('dblclick', { bubbles: true, button: 0 }));
                await tick();
                assertEqual(c.abstraction.seen, 'dblclick:a:0', 'bare method reference receives (event, item, index) inside a foreach');
                c.destroy();
            });

            await test('mousedown and mouseup bindings invoke their bound methods on real events', async function () {
                const c = mount(
                    '<button id="md" data-pac-bind="mousedown: onDown(), mouseup: onUp()">button</button>',
                    { downCalls: 0, upCalls: 0, onDown() { this.downCalls++; }, onUp() { this.upCalls++; } }
                );
                await tick();
                const btn = c.container.querySelector('#md');
                btn.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, button: 0 }));
                await tick();
                assertEqual(c.abstraction.downCalls, 1, 'mousedown fires once');
                btn.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, button: 0 }));
                await tick();
                assertEqual(c.abstraction.upCalls, 1, 'mouseup fires once');
                c.destroy();
            });

            await test('contextmenu and wheel bindings invoke their bound methods on real events', async function () {
                const c = mount(
                    '<div id="cw" data-pac-bind="contextmenu: onContext(), wheel: onWheel()">area</div>',
                    { contextCalls: 0, wheelCalls: 0, onContext() { this.contextCalls++; }, onWheel() { this.wheelCalls++; } }
                );
                await tick();
                const el = c.container.querySelector('#cw');
                el.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true }));
                await tick();
                assertEqual(c.abstraction.contextCalls, 1, 'contextmenu fires once');
                el.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, deltaY: 10 }));
                await tick();
                assertEqual(c.abstraction.wheelCalls, 1, 'wheel fires once');
                c.destroy();
            });

            await test('keydown binding invokes the bound method on a real keydown, with the native key reachable via $event.originalEvent', async function () {
                const c = mount(
                    '<input id="kd" data-pac-bind="keydown: onKeyDown($event)">',
                    { seenKey: null, onKeyDown(event) { this.seenKey = event.originalEvent.key; } }
                );
                await tick();
                c.container.querySelector('#kd').dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, key: 'a' }));
                await tick();
                assertEqual(c.abstraction.seenKey, 'a', 'keydown binding can reach the native KeyboardEvent via $event.originalEvent');
                c.destroy();
            });

            await test('keydown binding is not applied to the DOM as a literal attribute', async function () {
                const c = mount(
                    '<input id="kdAttr" data-pac-bind="keydown: onKeyDown()">',
                    { onKeyDown() {} }
                );
                await tick();
                assert(!c.container.querySelector('#kdAttr').hasAttribute('keydown'), 'keydown must not be set as a literal DOM attribute');
                c.destroy();
            });

            suite('Mouse target resolution');

            await test('MSG_MOUSEMOVE over a decorative descendant resolves target to the owning control', async function () {
                const c = mount(
                    '<button id="btn"><span id="icon">*</span></button>',
                    {
                        moveTargets: [],
                        enterTargets: [],
                        msgProc(message) {
                            if (message.message === wakaPAC.MSG_MOUSEMOVE) {
                                this.moveTargets.push(message.target.id);
                            }
                            if (message.message === wakaPAC.MSG_MOUSEENTER_DESCENDANT) {
                                this.enterTargets.push(message.target.id);
                            }
                        }
                    }
                );
                await tick();
                moveOver(c.container.querySelector('#icon'));
                await flushMouseMove();
                assert(c.abstraction.enterTargets.includes('btn'), 'MSG_MOUSEENTER_DESCENDANT resolved to the button');
                assert(c.abstraction.moveTargets.length > 0, 'at least one MSG_MOUSEMOVE delivered');
                assert(
                    c.abstraction.moveTargets.every(function (id) { return id === 'btn'; }),
                    'every MSG_MOUSEMOVE target resolved to the button while hovering its icon, got ' + JSON.stringify(c.abstraction.moveTargets)
                );
                c.destroy();
            });

            await test('MSG_MOUSEENTER_DESCENDANT/MSG_MOUSELEAVE_DESCENDANT fire for every nested interactive ancestor, not just the nearest one', async function () {
                // Three levels deep; lvl3 is inherently interactive (<button>) with no
                // mouseenter binding of its own — chain tracking is msgProc-visible regardless.
                const c = mount(
                    '<div id="lvl1" data-pac-bind="mouseenter: enter1, mouseleave: leave1">' +
                    '<div id="lvl2" data-pac-bind="mouseenter: enter2, mouseleave: leave2">' +
                    '<button id="lvl3">deep</button>' +
                    '</div></div>',
                    {
                        events: [],
                        enter1() {}, leave1() {}, enter2() {}, leave2() {},
                        msgProc(message) {
                            if (message.message === wakaPAC.MSG_MOUSEENTER_DESCENDANT) {
                                this.events.push('enter:' + message.target.id);
                            }
                            if (message.message === wakaPAC.MSG_MOUSELEAVE_DESCENDANT) {
                                this.events.push('leave:' + message.target.id);
                            }
                        }
                    }
                );
                await tick();

                // Jump straight from outside onto the innermost element in one move.
                moveOver(c.container.querySelector('#lvl3'));
                await flushMouseMove();
                assertEqual(
                    c.abstraction.events,
                    ['enter:lvl1', 'enter:lvl2', 'enter:lvl3'],
                    'landing directly on the deepest element fires every ancestor mouseenter, outermost first, in the same move'
                );

                // Jump straight back out to unrelated content in one move.
                moveOver(fixtures);
                await flushMouseMove();
                assertEqual(
                    c.abstraction.events,
                    ['enter:lvl1', 'enter:lvl2', 'enter:lvl3', 'leave:lvl3', 'leave:lvl2', 'leave:lvl1'],
                    'leaving directly fires every ancestor mouseleave, innermost first'
                );

                c.destroy();
            });

            await test('MSG_MOUSEMOVE over plain content reports the literal element', async function () {
                const c = mount('<div id="content">plain</div>', {
                    moveTargets: [],
                    msgProc(message) {
                        if (message.message === wakaPAC.MSG_MOUSEMOVE) {
                            this.moveTargets.push(message.target.id);
                        }
                    }
                });
                await tick();
                moveOver(c.container.querySelector('#content'));
                await flushMouseMove();
                assert(
                    c.abstraction.moveTargets.includes('content'),
                    'plain non-control content reported as itself, got ' + JSON.stringify(c.abstraction.moveTargets)
                );
                c.destroy();
            });

            await test('MSG_MOUSEWHEEL over a decorative descendant resolves target to the owning control, wParam intact', async function () {
                const c = mount(
                    '<button id="wheelBtn"><span id="wheelIcon">*</span></button>',
                    {
                        wheelTargets: [],
                        wheelDeltas: [],
                        msgProc(message) {
                            if (message.message === wakaPAC.MSG_MOUSEWHEEL) {
                                this.wheelTargets.push(message.target.id);
                                this.wheelDeltas.push(wakaPAC.GET_WHEEL_DELTA(message.wParam));
                            }
                        }
                    }
                );
                await tick();
                c.container.querySelector('#wheelIcon').dispatchEvent(
                    new WheelEvent('wheel', { bubbles: true, deltaY: 10 })
                );
                await tick();
                assertEqual(c.abstraction.wheelTargets, ['wheelBtn']);
                // Verifies buildWheelWParam() still encodes correctly now that it's
                // called from _setupMouseWheelEvent() and passed in as wParamOverride,
                // rather than from inside dispatchMouseMessage() itself.
                assertEqual(c.abstraction.wheelDeltas, [120]);
                c.destroy();
            });

            await test('MSG_MOUSEWHEEL over plain content reports the literal element', async function () {
                const c = mount('<div id="wheelContent">plain</div>', {
                    wheelTargets: [],
                    msgProc(message) {
                        if (message.message === wakaPAC.MSG_MOUSEWHEEL) {
                            this.wheelTargets.push(message.target.id);
                        }
                    }
                });
                await tick();
                c.container.querySelector('#wheelContent').dispatchEvent(
                    new WheelEvent('wheel', { bubbles: true, deltaY: 10 })
                );
                await tick();
                assertEqual(c.abstraction.wheelTargets, ['wheelContent']);
                c.destroy();
            });

            await test('MSG_DRAGENTER over a decorative descendant resolves target to the owning control', async function () {
                const c = mount(
                    '<button id="dragBtn"><span id="dragIcon">*</span></button>',
                    {
                        enterTargets: [],
                        msgProc(message) {
                            if (message.message === wakaPAC.MSG_DRAGENTER) {
                                this.enterTargets.push(message.target.id);
                            }
                        }
                    }
                );
                await tick();
                c.container.querySelector('#dragIcon').dispatchEvent(
                    new DragEvent('dragenter', { bubbles: true, dataTransfer: new DataTransfer() })
                );
                await tick();
                assertEqual(c.abstraction.enterTargets, ['dragBtn']);
                c.destroy();
            });

            await test('MSG_DROP over a decorative descendant resolves target to the owning control', async function () {
                const c = mount(
                    '<button id="dropBtn" data-pac-drop-target="copy"><span id="dropIcon">*</span></button>',
                    {
                        dropTargets: [],
                        msgProc(message) {
                            if (message.message === wakaPAC.MSG_DROP) {
                                this.dropTargets.push(message.target.id);
                            }
                        }
                    }
                );
                await tick();
                c.container.querySelector('#dropIcon').dispatchEvent(
                    new DragEvent('drop', { bubbles: true, dataTransfer: new DataTransfer() })
                );
                await tick();
                assertEqual(c.abstraction.dropTargets, ['dropBtn']);
                c.destroy();
            });

            await test('MSG_GESTURE resolves target to the owning control', async function () {
                const c = mount(
                    '<button id="gestureBtn"><span id="gestureIcon">*</span></button>',
                    {
                        gestureTargets: [],
                        msgProc(message) {
                            if (message.message === wakaPAC.MSG_GESTURE) {
                                this.gestureTargets.push(message.target.id);
                            }
                        }
                    }
                );
                await tick();
                const icon = c.container.querySelector('#gestureIcon');

                // A right-button drag traced purely rightward matches the built-in
                // 'right' pattern (see MouseGestureRecognizer.patterns).
                icon.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, button: 2, clientX: 0, clientY: 0 }));
                icon.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, button: 2, clientX: 150, clientY: 0 }));
                await flushMouseMove();
                icon.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, button: 2, clientX: 150, clientY: 0 }));
                await tick();
                assertEqual(c.abstraction.gestureTargets, ['gestureBtn']);
                c.destroy();
            });

            suite('Component lifecycle');

            await test('component is registered under its pacId while mounted', async function () {
                const c = mount('<p>{{count}}</p>', { count: 0 });
                assert(!!wakaPAC.getContextByPacId(c.pacId), 'context resolvable while mounted');
                c.destroy();
            });

            await test('removing the container deregisters the component', async function () {
                const c = mount('<p>{{count}}</p>', { count: 0 });
                await tick();
                c.destroy();
                await tick();
                assert(!wakaPAC.getContextByPacId(c.pacId), 'context gone after removal');
            });

            // ── Summary ───────────────────────────────────────────────────────────

            const total = passed + failed;
            summary.textContent = failed === 0
                ? '✓ All ' + total + ' tests passed'
                : '✗ ' + failed + ' of ' + total + ' tests failed';
            summary.className = failed === 0 ? 'all-pass' : 'has-fail';
        }

        runAll().catch(function (err) {
            console.error('Test runner error:', err);
            summary.textContent = 'ERROR: ' + (err.message || err);
            summary.className = 'has-fail';
        });

    })();
</script>
